name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate manifest, files and JavaScript syntax
        run: node .github/scripts/validate-extension.js
